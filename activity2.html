<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity 2: Registration Form Layout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="forms.css">
</head>
<body>
  <div class="wrapper">

    <!-- Header section: title styled with CSS -->
    <header class="site-header">
      <p class="course">Activity 2 &middot; Page Layout</p>
      <h1 class="page-title">Student Registration</h1>
    </header>

    <main class="content">
      <!-- Form container: registration form styled with CSS -->
      <div class="form-box reg-form">
        <form action="#" method="post">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Ayesha Tariq" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="reg">Registration No</label>
            <input type="text" id="reg" name="reg" placeholder="FA24-BSE-029" pattern="FA[0-9]{2}-BSE-[0-9]{3}" required>
          </div>
          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="pakistan">Pakistan</option>
              <option value="canada">Canada</option>
              <option value="usa">USA</option>
            </select>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <div class="radio-row">
              <label><input type="radio" name="gender" value="female"> Female</label>
              <label><input type="radio" name="gender" value="male"> Male</label>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div class="form-group">
            <label><input type="checkbox" name="agree" required> I agree to the terms</label>
          </div>
          <div class="row">
            <input type="submit" class="submit-btn" value="Register">
          </div>
        </form>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="activity1.html">Previous: Activity 1</a>
        <a href="activity3.html">Next: Activity 3</a>
      </nav>
    </main>
  </div>
</body>
</html>
